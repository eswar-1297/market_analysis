name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual re-run of the current commit, no new push needed

# Never run two deploys at once against the same server.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_PORT: ${{ secrets.SSH_PORT }}
  SSH_USER: ${{ secrets.SSH_USER }}
  DEPLOY_DIR: /opt/market_analysis
  IMAGE_NAME: market-analysis
  HEALTH_URL: https://cloudfuzeanalytics.cftools.live

permissions:
  contents: read # nothing in this workflow pushes to git

jobs:
  # ---------------------------------------------------------------------
  # 1. Syntax check — fails fast, touches nothing on the server.
  # ---------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server deps
        run: npm ci

      - name: Syntax-check every server JS file
        run: |
          set -euo pipefail
          find server -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "All server files pass a syntax check."

  # ---------------------------------------------------------------------
  # 2. Deploy — build, swap, health-check, with automatic recovery on failure.
  # ---------------------------------------------------------------------
  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Package release with git archive
        run: git archive --format=tar.gz -o release.tar.gz HEAD

      - name: Upload release to server
        run: |
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT}" release.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/release-${{ github.sha }}.tar.gz"

      - name: Extract release (overlay only — never wipes the deploy directory)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "
            set -euo pipefail
            mkdir -p ${DEPLOY_DIR}
            tar -xzf /tmp/release-${{ github.sha }}.tar.gz -C ${DEPLOY_DIR}
            rm -f /tmp/release-${{ github.sha }}.tar.gz
            chmod +x ${DEPLOY_DIR}/.deploy/*.sh
          "

      - name: Database backup
        run: |
          echo "market_analysis has no database configured — skipping backup."
          echo "If a database is added later, back it up here (e.g. pg_dump) BEFORE the build step below, and fail this step if the dump file is empty or suspiciously small."

      # Build happens on a throwaway tag. If this fails, the currently
      # running container is completely untouched — nothing to roll back.
      - name: Build new image (does not touch the running container)
        id: build
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "bash ${DEPLOY_DIR}/.deploy/deploy-build.sh ${{ github.sha }}"

      - name: Swap in the new version
        id: swap
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "bash ${DEPLOY_DIR}/.deploy/deploy-swap.sh ${{ github.sha }}"

      - name: Health check
        id: healthcheck
        if: steps.swap.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "Health check attempt $i/10..."
            if curl -fsSL --max-time 10 "${HEALTH_URL}" > /dev/null; then
              echo "Health check passed."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Health check failed after 10 attempts."
          exit 1

      # -----------------------------------------------------------------
      # Automatic rollback of the running container. Never touches git —
      # main is left exactly as pushed. Runs if the swap or the health
      # check failed. (A build failure needs no rollback at all: nothing
      # was ever swapped in, so the currently running container was never
      # touched in the first place.)
      #
      # This is production's actual safety net: whatever commit is tagged
      # market-analysis:previous on the server (the last commit that
      # itself passed a health check) is what comes back, regardless of
      # what main says. Fix the code, push again — the next push either
      # replaces :previous with the fix, or (if it fails too) rolls back
      # to the same known-good :previous again.
      #
      # NOTE: this undoes the running container, not a database. A
      # migration that partially applied before the failure is NOT undone
      # by this — that needs a human to check manually.
      # -----------------------------------------------------------------
      - name: "Automatic rollback of the running container"
        if: steps.swap.outcome == 'failure' || steps.healthcheck.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "bash ${DEPLOY_DIR}/.deploy/rollback.sh"

      - name: Fail the workflow if the deploy did not succeed
        if: steps.build.outcome == 'failure' || steps.swap.outcome == 'failure' || steps.healthcheck.outcome == 'failure'
        run: |
          echo "::error::Deploy failed — production was rolled back automatically (or never touched, if the build itself failed) and is running the last commit that passed its own health check. main is left as-is; nothing was reverted in git. Check this run's logs, fix the issue, and push again."
          exit 1
